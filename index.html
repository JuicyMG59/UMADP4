<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>絕妖星P4小工具</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c2f33;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 750px; 
        }
        
        /* 顯示成果的介面 */
        #result-display {
            background-color: #0b0c0e; 
            border: 2px solid #5b6eae;
            border-radius: 8px;
            min-height: 160px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 讓上下半部的容器擁有一樣的最大寬度，並且置中 */
        #round-table-container, #floor-box {
            width: 100%;
            max-width: 450px; /* 固定共同寬度 */
            align-self: center; /* 在黑框中水平置中 */
            justify-content: center;
        }

        /* 上半部：第一輪與第二輪的表格容器 */
        #round-table-container {
            display: none; 
            border-bottom: 1px dashed #5b6eae; /* 虛線現在也會跟表格一樣寬 */
            padding-bottom: 15px;
        }

        /* 兩個表格共用的對齊核心設定 */
        .round-table, .floor-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* 強制均分寬度：上半部 50% 50% / 下半部 25% 25% 25% 25% */
            color: #ffffff; /* 改為白色 */
            font-family: "MS Gothic", "MingLiU", monospace;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
        }

        /* 標題列 (第一輪 / 第二輪) */
        .round-table th {
            color: #f1c40f;
            font-size: 18px;
            padding-bottom: 15px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* 表格內部儲存格 */
        .round-table td {
            padding: 6px 10px;
            height: 24px; 
            letter-spacing: 1px;
        }

        /* 中央的分隔線 (左半邊的右框線) */
        .round-table th:first-child,
        .round-table td:first-child {
            border-right: 1px solid #444; 
        }

        /* 鋼鐵/月環專用底部列 */
        .round-table .bottom-step td {
            border-top: 1px solid #333; 
            padding-top: 15px;
            padding-bottom: 5px;
            letter-spacing: 2px;
        }

        /* 下半部：雷冰地板的表格外框 */
        #floor-box {
            display: none;
            padding-top: 5px;
        }

        .floor-table td {
            border: 1px solid #5b6eae; 
            padding: 6px 10px; /* 稍微縮小 padding 以配合 fixed layout */
        }

        #label-row td {
            color: #b9bbbe; 
            font-size: 15px;
            background-color: #181a1f; 
        }

        /* 6x4 按鈕與標籤網格 */
        .button-grid {
            display: grid;
            grid-template-columns: minmax(100px, auto) repeat(4, 1fr) minmax(100px, auto);
            grid-template-rows: repeat(4, 60px);
            gap: 10px;
            margin-bottom: 20px;
            align-items: center; 
        }

        .grid-label {
            font-size: 14px;
            font-weight: bold;
            color: #b9bbbe;
            text-align: center;
        }

        .mechanic-btn {
            background-color: #4f545c;
            color: white;
            border: 2px solid #23272a;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%; 
            width: 100%;
        }
        .mechanic-btn:hover { background-color: #7289da; }
        .mechanic-btn:active { background-color: #5b6eae; }

        .mechanic-btn.fire-btn { background-color: #e74c3c; }
        .mechanic-btn.fire-btn:hover { background-color: #c0392b; }

        .mechanic-btn.tsunami-btn { background-color: #3498db; }
        .mechanic-btn.tsunami-btn:hover { background-color: #2980b9; }

        .mechanic-btn.lightning-btn { background-color: #8e44ad; }
        .mechanic-btn.lightning-btn:hover { background-color: #732d91; }

        .mechanic-btn.ice-btn { background-color: #ffffff; color: #000000; }
        .mechanic-btn.ice-btn:hover { background-color: #cccccc; }
        
        .dynamic-btn {
            display: none;
            background-color: #9b59b6;
        }
        .dynamic-btn:hover { background-color: #8e44ad; }

        .sub-dynamic-btn {
            display: none;
            background-color: #f1c40f;
            color: #000000; 
        }
        .sub-dynamic-btn:hover { background-color: #d4ac0d; }
        
        .col-1 { grid-column: 1; }
        .col-2 { grid-column: 2; }
        .col-3 { grid-column: 3; }
        .col-4 { grid-column: 4; }
        .col-5 { grid-column: 5; }
        .col-6 { grid-column: 6; }
        .row-1 { grid-row: 1; }
        .row-2 { grid-row: 2; }
        .row-3 { grid-row: 3; }
        .row-4 { grid-row: 4; }

        .control-btns {
            display: flex;
            justify-content: center;
        }
        .clear-btn {
            background-color: #ed4245;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 40px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .clear-btn:hover { background-color: #c03537; }
    </style>
</head>
<body>

<div class="container">
    <h2>絕妖星P4小工具</h2>
    
    <!-- 顯示成果的介面 -->
    <div id="result-display">
        <!-- 上半部：使用表格結構重新排版的第一輪與第二輪 -->
        <div id="round-table-container">
            <table class="round-table">
                <thead>
                    <tr>
                        <th>第一輪</th>
                        <th>第二輪</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="r1-line1"></td>
                        <td id="r2-line1"></td>
                    </tr>
                    <tr>
                        <td id="r1-line2"></td>
                        <td id="r2-line2"></td>
                    </tr>
                    <tr>
                        <td id="r1-line3"></td>
                        <td id="r2-line3"></td>
                    </tr>
                    <!-- 烈炎與海嘯專用格 -->
                    <tr class="bottom-step">
                        <td id="r1-bottom"></td>
                        <td id="r2-bottom"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <!-- 下半部：地板專用表格 -->
        <div id="floor-box">
            <table class="floor-table">
                <tr id="thunder-row" style="display: none;"></tr>
                <tr id="ice-row" style="display: none;"></tr>
                <tr id="label-row" style="display: none;">
                    <td>雷</td><td>冰</td><td>全</td><td>無</td>
                </tr>
            </table>
        </div>
    </div>

    <!-- 6x4 網格 (文字標籤 + 按鈕) -->
    <div class="button-grid" id="button-grid">
        
        <!-- ================= 第1列 ================= -->
        <div class="grid-label col-1 row-1">第一輪視線</div>
        <button id="btn-1" class="mechanic-btn col-2 row-1 base-btn" onclick="handleMechanic(1)">真</button>
        <button id="btn-2" class="mechanic-btn col-3 row-1 base-btn" onclick="handleMechanic(2)">假</button>
        
        <button id="btn-3" class="mechanic-btn fire-btn col-4 row-1 base-btn" onclick="handleMechanic(3)">真</button>
        <button id="btn-4" class="mechanic-btn fire-btn col-5 row-1 base-btn" onclick="handleMechanic(4)">假</button>
        <div class="grid-label col-6 row-1">卡歐斯烈炎</div>


        <!-- ================= 第2列 ================= -->
        <div class="grid-label col-1 row-2">身上的buff長短</div>
        <button id="btn-5" class="mechanic-btn dynamic-btn col-2 row-2" onclick="handleMechanic(5)">長buff</button>
        <button id="btn-9" class="mechanic-btn dynamic-btn col-3 row-2" onclick="handleMechanic(9)">短buff</button>
        <button id="btn-6" class="mechanic-btn dynamic-btn col-2 row-2" onclick="handleMechanic(6)">長buff</button>
        <button id="btn-10" class="mechanic-btn dynamic-btn col-3 row-2" onclick="handleMechanic(10)">短buff</button>
        
        <button id="btn-7" class="mechanic-btn tsunami-btn col-4 row-2 base-btn" onclick="handleMechanic(7)">真</button>
        <button id="btn-8" class="mechanic-btn tsunami-btn col-5 row-2 base-btn" onclick="handleMechanic(8)">假</button>
        <div class="grid-label col-6 row-2">卡歐斯海嘯</div>


        <!-- ================= 第3列 ================= -->
        <div class="grid-label col-1 row-3">第二輪視線</div>
        <button id="btn-15" class="mechanic-btn sub-dynamic-btn col-2 row-3" onclick="handleMechanic(15)">真</button>
        <button id="btn-16" class="mechanic-btn sub-dynamic-btn col-3 row-3" onclick="handleMechanic(16)">假</button>
        <button id="btn-11" class="mechanic-btn sub-dynamic-btn col-2 row-3" onclick="handleMechanic(11)">真</button>
        <button id="btn-12" class="mechanic-btn sub-dynamic-btn col-3 row-3" onclick="handleMechanic(12)">假</button>
        <button id="btn-17" class="mechanic-btn sub-dynamic-btn col-2 row-3" onclick="handleMechanic(17)">真</button>
        <button id="btn-18" class="mechanic-btn sub-dynamic-btn col-3 row-3" onclick="handleMechanic(18)">假</button>
        <button id="btn-13" class="mechanic-btn sub-dynamic-btn col-2 row-3" onclick="handleMechanic(13)">真</button>
        <button id="btn-14" class="mechanic-btn sub-dynamic-btn col-3 row-3" onclick="handleMechanic(14)">假</button>

        <button id="btn-19" class="mechanic-btn lightning-btn col-4 row-3 base-btn" onclick="handleMechanic(19)">真</button>
        <button id="btn-20" class="mechanic-btn lightning-btn col-5 row-3 base-btn" onclick="handleMechanic(20)">假</button>
        <div class="grid-label col-6 row-3">卡夫卡雷地板</div>


        <!-- ================= 第4列 ================= -->
        <button id="btn-21" class="mechanic-btn ice-btn col-4 row-4 base-btn" onclick="handleMechanic(21)">真</button>
        <button id="btn-22" class="mechanic-btn ice-btn col-5 row-4 base-btn" onclick="handleMechanic(22)">假</button>
        <div class="grid-label col-6 row-4">卡夫卡冰地板</div>

    </div>

    <!-- 控制區 -->
    <div class="control-btns">
        <button class="clear-btn" onclick="resetAll()">清除紀錄與重置按鈕</button>
    </div>
</div>

<script>
    const thirdRoundGroup = [11, 12, 13, 14, 15, 16, 17, 18];

    const mechanicsConfig = {
        1: { type: 'sight', group: [1, 2], show: [5, 9] },
        2: { type: 'sight', group: [1, 2], show: [6, 10] },
        
        3: { out: '鋼鐵', group: [3, 4], type: 'tag', target: 'r1-bottom' },
        4: { out: '月環', group: [3, 4], type: 'tag', target: 'r1-bottom' },
        7: { out: '月環', group: [7, 8], type: 'tag', target: 'r2-bottom' },
        8: { out: '鋼鐵', group: [7, 8], type: 'tag', target: 'r2-bottom' },
        
        19: { type: 'floor', group: [19, 20], row: 'thunder', data: ['Ｘ', 'Ｏ', 'Ｘ', 'Ｏ'] },
        20: { type: 'floor', group: [19, 20], row: 'thunder', data: ['Ｏ', 'Ｘ', 'Ｏ', 'Ｘ'] },
        21: { type: 'floor', group: [21, 22], row: 'ice', data: ['Ｏ', 'Ｘ', 'Ｘ', 'Ｏ'] },
        22: { type: 'floor', group: [21, 22], row: 'ice', data: ['Ｘ', 'Ｏ', 'Ｏ', 'Ｘ'] },
        
        5: { type: 'mine', group: [5, 9], show: [15, 16] },
        9: { type: 'mine', group: [5, 9], show: [11, 12] },
        6: { type: 'mine', group: [6, 10], show: [17, 18] },
        10: { type: 'mine', group: [6, 10], show: [13, 14] },

        15: { type: 'third-round', group: thirdRoundGroup, r1: "【雷】出\n全部:停\n背對", r2: "【雷】出\n全部停\n背對" },
        16: { type: 'third-round', group: thirdRoundGroup, r1: "【水】出\n閒:動 石:停\n背對", r2: "【雷】出\n閒:停 石:動\n面對" },
        17: { type: 'third-round', group: thirdRoundGroup, r1: "【雷】出\n閒:停 石:動\n面對", r2: "【水】出\n閒:動 石:停\n背對" },
        18: { type: 'third-round', group: thirdRoundGroup, r1: "【水】出\n全部:動\n面對", r2: "【水】出\n全部:動\n面對" },
        11: { type: 'third-round', group: thirdRoundGroup, r1: "【雷】出\n全部:停\n背對", r2: "【雷】出\n全部:停\n背對" },
        12: { type: 'third-round', group: thirdRoundGroup, r1: "【雷】出\n閒:動 石:停\n背對", r2: "【水】出\n閒：停 石：動\n面對" },
        13: { type: 'third-round', group: thirdRoundGroup, r1: "【水】出\n閒：停 石：動\n面對", r2: "【雷】出\n閒：動 石：停\n背對" },
        14: { type: 'third-round', group: thirdRoundGroup, r1: "【水】出\n全部:動\n面對", r2: "【水】出\n全部:動\n面對" }
    };

    function handleMechanic(id) {
        const config = mechanicsConfig[id];
        if(!config) return;

        if (config.group) {
            config.group.forEach(btnId => {
                const btn = document.getElementById(`btn-${btnId}`);
                if (btn) btn.style.display = 'none'; 
            });
        }

        if (config.show) {
            config.show.forEach(btnId => {
                const btn = document.getElementById(`btn-${btnId}`);
                if (btn) btn.style.display = 'flex'; 
            });
        }

        if (config.type === 'sight' || config.type === 'tag') {
            document.getElementById('round-table-container').style.display = 'flex';
            if (config.type === 'tag') {
                document.getElementById(config.target).innerText = config.out;
            }
        } else if (config.type === 'third-round') {
            document.getElementById('round-table-container').style.display = 'flex';
            
            if (config.r1) {
                const lines = config.r1.split('\n');
                document.getElementById('r1-line1').innerText = lines[0] || '';
                document.getElementById('r1-line2').innerText = lines[1] || '';
                document.getElementById('r1-line3').innerText = lines[2] || '';
            }
            if (config.r2) {
                const lines = config.r2.split('\n');
                document.getElementById('r2-line1').innerText = lines[0] || '';
                document.getElementById('r2-line2').innerText = lines[1] || '';
                document.getElementById('r2-line3').innerText = lines[2] || '';
            }
        } else if (config.type === 'floor') {
            document.getElementById('floor-box').style.display = 'flex';
            if (config.row === 'thunder') {
                const tr = document.getElementById('thunder-row');
                tr.style.display = 'table-row';
                tr.innerHTML = config.data.map(d => `<td>${d}</td>`).join('');
            }
            if (config.row === 'ice') {
                const tr = document.getElementById('ice-row');
                tr.style.display = 'table-row';
                tr.innerHTML = config.data.map(d => `<td>${d}</td>`).join('');
                document.getElementById('label-row').style.display = 'table-row';
            }
        }
    }

    function resetAll() {
        const textIds = [
            'r1-line1', 'r1-line2', 'r1-line3', 'r1-bottom', 
            'r2-line1', 'r2-line2', 'r2-line3', 'r2-bottom'
        ];
        textIds.forEach(id => {
            document.getElementById(id).innerText = '';
        });
        document.getElementById('round-table-container').style.display = 'none';
        
        document.getElementById('floor-box').style.display = 'none';
        document.getElementById('thunder-row').style.display = 'none';
        document.getElementById('thunder-row').innerHTML = '';
        document.getElementById('ice-row').style.display = 'none';
        document.getElementById('ice-row').innerHTML = '';
        document.getElementById('label-row').style.display = 'none';
        
        const allButtons = document.querySelectorAll('.mechanic-btn');
        allButtons.forEach(btn => {
            btn.style.visibility = 'visible'; 
            
            if (btn.classList.contains('dynamic-btn') || btn.classList.contains('sub-dynamic-btn')) {
                btn.style.display = 'none';
            } else {
                btn.style.display = 'flex'; 
            }
        });
    }
</script>

</body>
</html>
