<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>絕妖星P4小工具</title>
    <!-- 確保在手機上全螢幕且無網址列 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* 鎖死整個頁面的高度，防止滾動與跳動 */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c2f33;
            color: #ffffff;
            display: flex;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 600px; 
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 10px 15px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin: 5px 0 10px 0;
            font-size: 20px;
        }
        
        /* === 上方紀錄版 === */
        #result-display {
            flex: 1 1 50%;
            background-color: #0b0c0e; 
            border: 2px solid #5b6eae;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden; 
            transition: all 0.3s ease; 
        }

        #round-table-container, #floor-box {
            width: 100%;
            align-self: center; 
            justify-content: center;
        }

        #round-table-container {
            flex: 1; 
            border-bottom: 1px dashed #5b6eae; 
            padding-bottom: 10px;
        }

        .round-table, .floor-table {
            width: 100%;
            height: 100%; 
            border-collapse: collapse;
            table-layout: fixed; 
            color: #ffffff; 
            font-family: "MS Gothic", "MingLiU", monospace;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .round-table th {
            color: #f1c40f;
            font-size: 16px;
            padding-bottom: 5px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .round-table td {
            padding: 4px 5px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .round-table th:first-child,
        .round-table td:first-child {
            border-right: 1px solid #444; 
        }

        .round-table .bottom-step td {
            border-top: 1px solid #333; 
            padding-top: 5px;
            letter-spacing: 2px;
        }

        #floor-box {
            flex: 0.45; 
            padding-top: 10px;
        }

        .floor-table td {
            border: 1px solid #5b6eae; 
            padding: 4px 8px; 
            transition: all 0.3s ease;
        }

        #label-row td {
            color: #b9bbbe; 
            font-size: 14px;
            background-color: #181a1f; 
            transition: all 0.3s ease;
        }

        /* === 紀錄版滿版狀態 === */
        #result-display.finished {
            flex: 1 1 100%; 
            justify-content: center;
            gap: 30px; 
        }
        #result-display.finished .round-table, 
        #result-display.finished .floor-table {
            font-size: 24px; 
        }
        #result-display.finished .round-table th {
            font-size: 26px; 
            padding-bottom: 15px;
        }
        #result-display.finished .round-table td {
            padding: 10px 5px; 
        }
        #result-display.finished .round-table .bottom-step td {
            padding-top: 15px;
        }
        #result-display.finished .floor-table td {
            padding: 12px 8px; 
        }
        #result-display.finished #label-row td {
            font-size: 20px; 
        }

        /* === 下方按鈕區 === */
        .button-area {
            flex: 1 1 50%;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: repeat(4, 1fr); 
            gap: 15px; 
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .button-slot {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: auto 1fr; 
            gap: 1px 10px; 
        }

        /* 確保重疊的網格不阻擋點擊 */
        #slot-sight-mine { grid-row: 1 / span 2; grid-column: 1; pointer-events: none; }
        #slot-fire-tsunami { 
            grid-row: 3 / span 2; 
            grid-column: 1; 
            pointer-events: none; 
            grid-template-rows: auto 1fr auto 1fr; 
        }
        #slot-floor { 
            grid-row: 1 / span 4; 
            grid-column: 1; 
            pointer-events: none; 
            grid-template-rows: auto 1fr auto 1fr; 
        }
        
        #slot-sight-mine > *, #slot-fire-tsunami > *, #slot-floor > * {
            pointer-events: auto;
        }

        .grid-label {
            font-size: 12px;
            font-weight: bold;
            color: #a0a5aa;
            text-align: center;
            align-self: center; 
            line-height: 1.2;
            margin: 0;
        }

        .mechanic-btn {
            background-color: #4f545c;
            color: white;
            border: 2px solid #23272a;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%; 
            width: 100%;
        }
        
        #slot-sight-mine .mechanic-btn { font-size: 28px; }
        #slot-fire-tsunami .mechanic-btn { font-size: 24px; }
        #slot-floor .mechanic-btn { font-size: 32px; }

        .mechanic-btn:active { background-color: #5b6eae; transform: scale(0.96); }

        .mechanic-btn.fire-btn { background-color: #e74c3c; }
        .mechanic-btn.tsunami-btn { background-color: #3498db; }
        .mechanic-btn.lightning-btn { background-color: #8e44ad; }
        .mechanic-btn.ice-btn { background-color: #ffffff; color: #000000; }
        
        .dynamic-btn { background-color: #9b59b6; }
        .sub-dynamic-btn { background-color: #f1c40f; color: #000000; }
        
        /* 網格定位模組 */
        .col-1 { grid-column: 1; }
        .col-2 { grid-column: 2; }
        .col-3 { grid-column: 3; }
        .col-4 { grid-column: 4; }
        .col-L { grid-column: 1 / span 2; } 
        .col-R { grid-column: 3 / span 2; } 
        .col-full { grid-column: 1 / span 4; } 

        .r-L1 { grid-row: 1; } 
        .r-B1 { grid-row: 2; }
        .r-L2 { grid-row: 3; }
        .r-B2 { grid-row: 4; }

        .control-btns {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
        }
        .clear-btn {
            background-color: #ed4245;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 40px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            max-width: 300px;
        }
        .clear-btn:active { background-color: #c03537; }
    </style>
</head>
<body>

<div class="container">
    <h2>絕妖星P4小工具</h2>
    
    <!-- 顯示成果的介面 -->
    <div id="result-display">
        <div id="round-table-container" style="display: flex;">
            <table class="round-table">
                <thead>
                    <tr><th>第一輪</th><th>第二輪</th></tr>
                </thead>
                <tbody>
                    <tr><td id="r1-line1"></td><td id="r2-line1"></td></tr>
                    <tr><td id="r1-line2"></td><td id="r2-line2"></td></tr>
                    <tr><td id="r1-line3"></td><td id="r2-line3"></td></tr>
                    <tr class="bottom-step"><td id="r1-bottom"></td><td id="r2-bottom"></td></tr>
                </tbody>
            </table>
        </div>
        
        <div id="floor-box" style="display: flex;">
            <table class="floor-table">
                <tr id="thunder-row"><td></td><td></td><td></td><td></td></tr>
                <tr id="ice-row"><td></td><td></td><td></td><td></td></tr>
                <tr id="label-row" style="visibility: hidden;">
                    <td>雷</td><td>冰</td><td>全</td><td>無</td>
                </tr>
            </table>
        </div>
    </div>

    <!-- 按鈕控制區 -->
    <div class="button-area" id="button-area">
        
        <!-- Slot 1: 第一/二/三輪視線 -->
        <div id="slot-sight-mine" class="button-slot">
            <div id="label-r1" class="grid-label col-full r-L1">第一輪視線</div>
            <div id="label-r2" class="grid-label col-full r-L1" style="visibility: hidden;">身上的buff長短</div>
            <div id="label-r3" class="grid-label col-full r-L1" style="visibility: hidden;">第二輪視線</div>

            <!-- 第一輪 -->
            <button id="btn-1" class="mechanic-btn col-L r-B1" onclick="handleMechanic(1)">真</button>
            <button id="btn-2" class="mechanic-btn col-R r-B1" onclick="handleMechanic(2)">假</button>
            
            <!-- 第二輪 -->
            <button id="btn-5" class="mechanic-btn dynamic-btn col-L r-B1" style="visibility: hidden;" onclick="handleMechanic(5)">長</button>
            <button id="btn-9" class="mechanic-btn dynamic-btn col-R r-B1" style="visibility: hidden;" onclick="handleMechanic(9)">短</button>
            <button id="btn-6" class="mechanic-btn dynamic-btn col-L r-B1" style="visibility: hidden;" onclick="handleMechanic(6)">長</button>
            <button id="btn-10" class="mechanic-btn dynamic-btn col-R r-B1" style="visibility: hidden;" onclick="handleMechanic(10)">短</button>

            <!-- 第三輪 -->
            <button id="btn-15" class="mechanic-btn sub-dynamic-btn col-L r-B1" style="visibility: hidden;" onclick="handleMechanic(15)">真</button>
            <button id="btn-16" class="mechanic-btn sub-dynamic-btn col-R r-B1" style="visibility: hidden;" onclick="handleMechanic(16)">假</button>
            <button id="btn-11" class="mechanic-btn sub-dynamic-btn col-L r-B1" style="visibility: hidden;" onclick="handleMechanic(11)">真</button>
            <button id="btn-12" class="mechanic-btn sub-dynamic-btn col-R r-B1" style="visibility: hidden;" onclick="handleMechanic(12)">假</button>
            <button id="btn-17" class="mechanic-btn sub-dynamic-btn col-L r-B1" style="visibility: hidden;" onclick="handleMechanic(17)">真</button>
            <button id="btn-18" class="mechanic-btn sub-dynamic-btn col-R r-B1" style="visibility: hidden;" onclick="handleMechanic(18)">假</button>
            <button id="btn-13" class="mechanic-btn sub-dynamic-btn col-L r-B1" style="visibility: hidden;" onclick="handleMechanic(13)">真</button>
            <button id="btn-14" class="mechanic-btn sub-dynamic-btn col-R r-B1" style="visibility: hidden;" onclick="handleMechanic(14)">假</button>
        </div>

        <!-- Slot 2: 烈炎 / 海嘯 -->
        <div id="slot-fire-tsunami" class="button-slot">
            <div id="label-fire" class="grid-label col-full r-L1">卡歐斯烈炎</div>
            <button id="btn-3" class="mechanic-btn fire-btn col-L r-B1" onclick="handleMechanic(3)">真</button>
            <button id="btn-4" class="mechanic-btn fire-btn col-R r-B1" onclick="handleMechanic(4)">假</button>
            
            <div id="label-tsunami" class="grid-label col-full r-L2" style="margin-top: 15px;">卡歐斯海嘯</div>
            <button id="btn-7" class="mechanic-btn tsunami-btn col-L r-B2" onclick="handleMechanic(7)">真</button>
            <button id="btn-8" class="mechanic-btn tsunami-btn col-R r-B2" onclick="handleMechanic(8)">假</button>
        </div>

        <!-- Slot Floor: 雷冰地板 -->
        <div id="slot-floor" class="button-slot">
            <!-- 雷地板 -->
            <div id="label-thunder" class="grid-label col-full r-L1" style="visibility: hidden;">卡夫卡雷地板</div>
            <button id="btn-19" class="mechanic-btn lightning-btn col-L r-B1" style="visibility: hidden;" onclick="handleMechanic(19)">真</button>
            <button id="btn-20" class="mechanic-btn lightning-btn col-R r-B1" style="visibility: hidden;" onclick="handleMechanic(20)">假</button>

            <!-- 冰地板 -->
            <div id="label-ice" class="grid-label col-full r-L2" style="visibility: hidden; margin-top: 15px;">卡夫卡冰地板</div>
            <button id="btn-21" class="mechanic-btn ice-btn col-L r-B2" style="visibility: hidden;" onclick="handleMechanic(21)">真</button>
            <button id="btn-22" class="mechanic-btn ice-btn col-R r-B2" style="visibility: hidden;" onclick="handleMechanic(22)">假</button>
        </div>

    </div>

    <!-- 控制區 -->
    <div class="control-btns">
        <button class="clear-btn" onclick="resetAll()">清除紀錄與重置</button>
    </div>
</div>

<script>
    // 加入 thunder 與 ice 狀態追蹤
    let state = {
        round3: false,
        fire: false,
        tsunami: false,
        thunder: false,
        ice: false
    };

    const btnToLabel = {
        1: 'label-r1', 2: 'label-r1',
        3: 'label-fire', 4: 'label-fire',
        7: 'label-tsunami', 8: 'label-tsunami',
        5: 'label-r2', 6: 'label-r2', 9: 'label-r2', 10: 'label-r2',
        11: 'label-r3', 12: 'label-r3', 13: 'label-r3', 14: 'label-r3', 
        15: 'label-r3', 16: 'label-r3', 17: 'label-r3', 18: 'label-r3',
        19: 'label-thunder', 20: 'label-thunder',
        21: 'label-ice', 22: 'label-ice'
    };

    const thirdRoundGroup = [11, 12, 13, 14, 15, 16, 17, 18];

    const mechanicsConfig = {
        1: { type: 'sight', group: [1, 2], show: [5, 9], showLabel: 'label-r2' },
        2: { type: 'sight', group: [1, 2], show: [6, 10], showLabel: 'label-r2' },
        
        3: { out: '鋼鐵', group: [3, 4], type: 'tag', target: 'r1-bottom', flag: 'fire' },
        4: { out: '月環', group: [3, 4], type: 'tag', target: 'r1-bottom', flag: 'fire' },
        7: { out: '月環', group: [7, 8], type: 'tag', target: 'r2-bottom', flag: 'tsunami' },
        8: { out: '鋼鐵', group: [7, 8], type: 'tag', target: 'r2-bottom', flag: 'tsunami' },
        
        // 賦予雷、冰對應的 flag
        19: { type: 'floor', group: [19, 20], row: 'thunder', data: ['Ｘ', 'Ｏ', 'Ｘ', 'Ｏ'], flag: 'thunder' },
        20: { type: 'floor', group: [19, 20], row: 'thunder', data: ['Ｏ', 'Ｘ', 'Ｏ', 'Ｘ'], flag: 'thunder' },
        21: { type: 'floor', group: [21, 22], row: 'ice', data: ['Ｏ', 'Ｘ', 'Ｘ', 'Ｏ'], flag: 'ice' },
        22: { type: 'floor', group: [21, 22], row: 'ice', data: ['Ｘ', 'Ｏ', 'Ｏ', 'Ｘ'], flag: 'ice' },
        
        5: { type: 'mine', group: [5, 6, 9, 10], show: [15, 16], showLabel: 'label-r3' },
        9: { type: 'mine', group: [5, 6, 9, 10], show: [11, 12], showLabel: 'label-r3' },
        6: { type: 'mine', group: [5, 6, 9, 10], show: [17, 18], showLabel: 'label-r3' },
        10: { type: 'mine', group: [5, 6, 9, 10], show: [13, 14], showLabel: 'label-r3' },

        15: { type: 'third-round', group: thirdRoundGroup, r1: "【雷】出\n全部:停\n背對", r2: "【雷】出\n全部停\n背對", flag: 'round3' },
        16: { type: 'third-round', group: thirdRoundGroup, r1: "【水】出\n閒:動 石:停\n背對", r2: "【雷】出\n閒:停 石:動\n面對", flag: 'round3' },
        17: { type: 'third-round', group: thirdRoundGroup, r1: "【雷】出\n閒:停 石:動\n面對", r2: "【水】出\n閒:動 石:停\n背對", flag: 'round3' },
        18: { type: 'third-round', group: thirdRoundGroup, r1: "【水】出\n全部:動\n面對", r2: "【水】出\n全部:動\n面對", flag: 'round3' },
        11: { type: 'third-round', group: thirdRoundGroup, r1: "【雷】出\n全部:停\n背對", r2: "【雷】出\n全部:停\n背對", flag: 'round3' },
        12: { type: 'third-round', group: thirdRoundGroup, r1: "【雷】出\n閒:動 石:停\n背對", r2: "【水】出\n閒：停 石：動\n面對", flag: 'round3' },
        13: { type: 'third-round', group: thirdRoundGroup, r1: "【水】出\n閒：停 石：動\n面對", r2: "【雷】出\n閒：動 石：停\n背對", flag: 'round3' },
        14: { type: 'third-round', group: thirdRoundGroup, r1: "【水】出\n全部:動\n面對", r2: "【水】出\n全部:動\n面對", flag: 'round3' }
    };

    function handleMechanic(id) {
        // [防呆機制] 如果按的是冰地板(21 或 22)，但雷地板還沒按，就直接取消動作
        if ((id === 21 || id === 22) && !state.thunder) {
            return;
        }

        const config = mechanicsConfig[id];
        if(!config) return;

        if (config.group) {
            config.group.forEach(btnId => {
                const btn = document.getElementById(`btn-${btnId}`);
                if (btn) btn.style.visibility = 'hidden'; 
            });
        }
        
        const hideLabelId = btnToLabel[id];
        if (hideLabelId) {
            document.getElementById(hideLabelId).style.visibility = 'hidden';
        }

        if (config.show) {
            config.show.forEach(btnId => {
                const btn = document.getElementById(`btn-${btnId}`);
                if (btn) btn.style.visibility = 'visible'; 
            });
        }
        if (config.showLabel) {
            document.getElementById(config.showLabel).style.visibility = 'visible';
        }

        if (config.type === 'tag') {
            document.getElementById(config.target).innerText = config.out;
        } else if (config.type === 'third-round') {
            if (config.r1) {
                const lines = config.r1.split('\n');
                document.getElementById('r1-line1').innerText = lines[0] || '';
                document.getElementById('r1-line2').innerText = lines[1] || '';
                document.getElementById('r1-line3').innerText = lines[2] || '';
            }
            if (config.r2) {
                const lines = config.r2.split('\n');
                document.getElementById('r2-line1').innerText = lines[0] || '';
                document.getElementById('r2-line2').innerText = lines[1] || '';
                document.getElementById('r2-line3').innerText = lines[2] || '';
            }
        } else if (config.type === 'floor') {
            if (config.row === 'thunder') {
                document.getElementById('thunder-row').innerHTML = config.data.map(d => `<td>${d}</td>`).join('');
            }
            if (config.row === 'ice') {
                document.getElementById('ice-row').innerHTML = config.data.map(d => `<td>${d}</td>`).join('');
                document.getElementById('label-row').style.visibility = 'visible';
            }
        }

        if (config.flag) {
            state[config.flag] = true;
            checkFloor();
        }

        // 當雷跟冰都按過後，觸發滿版放大
        if (state.thunder && state.ice) {
            document.getElementById('result-display').classList.add('finished');
            document.getElementById('button-area').style.display = 'none';
        }
    }

    function checkFloor() {
        if (state.round3 && state.fire && state.tsunami) {
            ['btn-19', 'btn-20', 'btn-21', 'btn-22', 'label-thunder', 'label-ice'].forEach(id => {
                document.getElementById(id).style.visibility = 'visible';
            });
        }
    }

    function resetAll() {
        state = { round3: false, fire: false, tsunami: false, thunder: false, ice: false };

        document.getElementById('result-display').classList.remove('finished');
        document.getElementById('button-area').style.display = 'grid';

        const textIds = [
            'r1-line1', 'r1-line2', 'r1-line3', 'r1-bottom', 
            'r2-line1', 'r2-line2', 'r2-line3', 'r2-bottom'
        ];
        textIds.forEach(id => { document.getElementById(id).innerText = ''; });
        
        document.getElementById('thunder-row').innerHTML = '<td></td><td></td><td></td><td></td>';
        document.getElementById('ice-row').innerHTML = '<td></td><td></td><td></td><td></td>';
        document.getElementById('label-row').style.visibility = 'hidden';
        
        document.querySelectorAll('.mechanic-btn, .grid-label').forEach(el => {
            el.style.visibility = 'hidden';
        });

        ['btn-1', 'btn-2', 'btn-3', 'btn-4', 'btn-7', 'btn-8'].forEach(id => {
            document.getElementById(id).style.visibility = 'visible';
        });
        ['label-r1', 'label-fire', 'label-tsunami'].forEach(id => {
            document.getElementById(id).style.visibility = 'visible';
        });
    }
</script>

</body>
</html>
